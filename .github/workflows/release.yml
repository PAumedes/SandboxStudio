name: Package Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-preview:
    runs-on: windows-latest
    name: Package Win-x64 Preview

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish WinUI3 Application
        run: >
          dotnet publish src/SandboxStudio.UI/SandboxStudio.UI.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -o ./dist

      - name: Create Preview Archive
        shell: pwsh
        run: Compress-Archive -Path ./dist/* -DestinationPath ./SandboxStudio-win-x64-preview.zip

      - name: Upload Preview Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SandboxStudio-win-x64-preview
          path: SandboxStudio-win-x64-preview.zip
          if-no-files-found: error
          retention-days: 14
