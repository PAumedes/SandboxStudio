name: Release

# One manual run builds both distributions from the same commit:
#   - the portable single-file exe, Authenticode-signed through SignPath when the
#     SIGNPATH_* variables are configured, attached to a GitHub release;
#   - the Microsoft Store .msixbundle, optionally submitted to Partner Center as
#     a draft submission (the Store signs it).
# Setup (secrets, variables, Partner Center): docs/RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (defaults to the project Version property)'
        required: false
        default: ''
      create_release:
        description: 'Create a GitHub Release (tag v<version>) instead of preview artifacts only'
        required: false
        type: boolean
        default: false
      submit_to_store:
        description: 'Upload the MSIX bundle to a draft Microsoft Store submission'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    name: Build, test and package
    outputs:
      version: ${{ steps.version.outputs.version }}
      exe-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve Version
        id: version
        shell: pwsh
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          $version = $env:VERSION_INPUT.Trim()
          if ($version -eq '') {
            $version = (dotnet msbuild src/SandboxStudio.UI/SandboxStudio.UI.csproj -getProperty:Version).Trim()
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Version '$version' is not a valid semver."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # Same gate as CI: nothing is packaged or released from a red build.
      - name: Restore Dependencies
        run: dotnet restore SandboxStudio.sln

      - name: Build Solution
        run: dotnet build SandboxStudio.sln --configuration Release --no-restore

      - name: Execute Unit Tests
        run: dotnet test tests/SandboxStudio.Tests.Unit/SandboxStudio.Tests.Unit.csproj --configuration Release --no-build

      - name: Execute Integration Tests
        run: dotnet test tests/SandboxStudio.Tests.Integration/SandboxStudio.Tests.Integration.csproj --configuration Release --no-build

      - name: Execute Smoke Tests
        run: dotnet test tests/SandboxStudio.Tests.Smoke/SandboxStudio.Tests.Smoke.csproj --configuration Release --no-build

      - name: Publish Single-File Executable
        shell: pwsh
        run: ./scripts/publish.ps1 -Version ${{ steps.version.outputs.version }} -RuntimeIdentifier win-x64 -OutputRoot dist

      # SignPath signs what this artifact holds, so it carries the exe alone.
      - name: Upload Unsigned Executable
        id: upload-exe
        uses: actions/upload-artifact@v7
        with:
          name: SandboxStudio-${{ steps.version.outputs.version }}-win-x64-unsigned
          path: dist/SandboxStudio-${{ steps.version.outputs.version }}-win-x64.exe
          if-no-files-found: error
          retention-days: 14

      - name: Package MSIX Bundle
        shell: pwsh
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          # Without the Partner Center identity the package keeps its development
          # identity: fine to inspect, rejected by the Store.
          $identity = @{}
          if ($env:STORE_IDENTITY_NAME) { $identity.IdentityName = $env:STORE_IDENTITY_NAME }
          if ($env:STORE_PUBLISHER) { $identity.Publisher = $env:STORE_PUBLISHER }
          if ($env:STORE_PUBLISHER_DISPLAY_NAME) { $identity.PublisherDisplayName = $env:STORE_PUBLISHER_DISPLAY_NAME }
          ./scripts/package-msix.ps1 -Version ${{ steps.version.outputs.version }} -OutputRoot dist @identity

      - name: Upload MSIX Bundle
        uses: actions/upload-artifact@v7
        with:
          name: SandboxStudio-${{ steps.version.outputs.version }}-msix
          path: dist/msix/*.msixbundle
          if-no-files-found: error
          retention-days: 14

  sign:
    needs: build
    # Opt-in: runs once the SignPath project is set up (docs/RELEASING.md).
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    name: Sign executable (SignPath)
    permissions:
      actions: read
      contents: read

    steps:
      - name: Submit Signing Request
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'SandboxStudio' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.exe-artifact-id }}
          wait-for-completion: true
          # Release signing waits for a manual approval in SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Upload Signed Executable
        uses: actions/upload-artifact@v7
        with:
          name: SandboxStudio-${{ needs.build.outputs.version }}-win-x64-signed
          path: signed/SandboxStudio-${{ needs.build.outputs.version }}-win-x64.exe
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [build, sign]
    # Signing is optional, but when it runs it must succeed.
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    runs-on: windows-latest
    name: Publish GitHub release
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Executable
        uses: actions/download-artifact@v8
        with:
          name: SandboxStudio-${{ needs.build.outputs.version }}-win-x64-${{ needs.sign.result == 'success' && 'signed' || 'unsigned' }}
          path: dist

      - name: Verify Signature and Checksum
        shell: pwsh
        env:
          SIGNED: ${{ needs.sign.result == 'success' }}
        run: |
          $exeName = "SandboxStudio-${{ needs.build.outputs.version }}-win-x64.exe"
          $exe = "dist/$exeName"
          $signature = Get-AuthenticodeSignature $exe
          if ($env:SIGNED -eq 'true' -and $signature.Status -ne 'Valid') {
            throw "SignPath returned $exeName with signature status '$($signature.Status)'."
          }
          Write-Host "Signature: $($signature.Status) $($signature.SignerCertificate.Subject)"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$sha  $exeName" | Out-File -FilePath "$exe.sha256" -Encoding ascii -NoNewline
          "SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SandboxStudio-${{ needs.build.outputs.version }}-win-x64
          path: |
            dist/SandboxStudio-${{ needs.build.outputs.version }}-win-x64.exe
            dist/SandboxStudio-${{ needs.build.outputs.version }}-win-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Generate Release Notes
        if: inputs.create_release
        shell: pwsh
        env:
          SIGNED: ${{ needs.sign.result == 'success' }}
          STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
        run: |
          $version = "${{ needs.build.outputs.version }}"
          $tag = "v$version"
          $exe = "SandboxStudio-$version-win-x64.exe"
          $exeMB = [math]::Round((Get-Item "dist/$exe").Length / 1MB, 1)
          $prevTag = git tag --sort=-version:refname | Select-Object -First 1
          $range = if ($prevTag) { "$prevTag..HEAD" } else { "HEAD" }
          $commitLines = git log $range --pretty=format:"- %s (%h)" --no-merges
          $commits = if ($commitLines) { $commitLines -join "`n" } else { "- No new commits" }
          $signing = if ($env:SIGNED -eq 'true') {
            "Signed with Authenticode. Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org)."
          } else {
            "This build is not code-signed, so Windows SmartScreen may warn on first launch. Verify the SHA-256 below."
          }
          $store = if ($env:STORE_PRODUCT_ID) {
            "`nPrefer automatic updates? Get SandboxStudio from the [Microsoft Store](https://apps.microsoft.com/detail/$($env:STORE_PRODUCT_ID)).`n"
          } else { "" }
          @"
          ## SandboxStudio $tag

          Portable Windows x64 app in a single file. Download ``$exe`` and run it — no installer, no .NET or Windows App SDK install needed. The first launch of each version takes a few extra seconds while it unpacks to ``%TEMP%\.net``.
          $store
          $signing

          ### Commits in this release
          $commits

          ### Artifact
          | File | Size | SHA-256 |
          |---|---|---|
          | ``$exe`` | $exeMB MB | ``$env:SHA256`` |

          > Built by GitHub Actions ``release.yml`` from commit ``${{ github.sha }}``.
          "@ | Out-File -FilePath release-notes.md -Encoding utf8

      - name: Create GitHub Release
        if: inputs.create_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ needs.build.outputs.version }}"
          $tag = "v$version"
          git tag -a $tag -m "SandboxStudio $version"
          git push origin $tag
          $exe = "dist/SandboxStudio-$version-win-x64.exe"
          gh release create $tag $exe "$exe.sha256" `
            --title "SandboxStudio $tag" `
            --notes-file release-notes.md `
            --repo ${{ github.repository }}
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed." }

  store:
    needs: build
    if: inputs.submit_to_store && vars.STORE_PRODUCT_ID != ''
    runs-on: windows-latest
    name: Submit to Microsoft Store (draft)

    steps:
      - name: Download MSIX Bundle
        uses: actions/download-artifact@v8
        with:
          name: SandboxStudio-${{ needs.build.outputs.version }}-msix
          path: msix

      - name: Setup Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1

      - name: Configure Microsoft Store Developer CLI
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET

      # --noCommit leaves the submission as a draft: review the listing and
      # submit it for certification in Partner Center.
      - name: Upload Draft Submission
        shell: pwsh
        run: |
          $bundle = Get-ChildItem msix -Filter *.msixbundle | Select-Object -First 1
          msstore publish $bundle.DirectoryName --inputFile $bundle.FullName --appId ${{ vars.STORE_PRODUCT_ID }} --noCommit --verbose
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed with exit code $LASTEXITCODE." }
