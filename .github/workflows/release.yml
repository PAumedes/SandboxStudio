name: Release Packaging

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  package:
    runs-on: windows-latest
    name: Package Release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish WinUI3 Application
        run: >
          dotnet publish src/SandboxStudio.UI/SandboxStudio.UI.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -o ./dist

      - name: Create Release Archive
        shell: pwsh
        run: Compress-Archive -Path ./dist/* -DestinationPath ./SandboxStudio-win-x64.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: SandboxStudio-win-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
