name: Package Preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (defaults to the project Version property)'
        required: false
        default: ''
      create_release:
        description: 'Create a GitHub Release (tag v<version>) instead of a preview artifact'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package-preview:
    runs-on: windows-latest
    name: Package Win-x64 Preview

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Same gate as CI: nothing is packaged or released from a red build.
      - name: Restore Dependencies
        run: dotnet restore SandboxStudio.sln

      - name: Build Solution
        run: dotnet build SandboxStudio.sln --configuration Release --no-restore

      - name: Execute Unit Tests
        run: dotnet test tests/SandboxStudio.Tests.Unit/SandboxStudio.Tests.Unit.csproj --configuration Release --no-build

      - name: Execute Integration Tests
        run: dotnet test tests/SandboxStudio.Tests.Integration/SandboxStudio.Tests.Integration.csproj --configuration Release --no-build

      - name: Execute Smoke Tests
        run: dotnet test tests/SandboxStudio.Tests.Smoke/SandboxStudio.Tests.Smoke.csproj --configuration Release --no-build

      - name: Publish Single-File Executable
        shell: pwsh
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          $version = $env:VERSION_INPUT.Trim()
          if ($version -ne '' -and $version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Version '$version' is not a valid semver."
          }
          if ($version -eq '') {
            $version = (dotnet msbuild src/SandboxStudio.UI/SandboxStudio.UI.csproj -getProperty:Version).Trim()
          }
          # Same script as local releases: publishes, checks the output is a single
          # exe, and writes dist/SandboxStudio-<version>-win-x64.exe(.sha256).
          ./scripts/publish.ps1 -Version $version -RuntimeIdentifier win-x64 -OutputRoot dist
          $sha = ((Get-Content "dist/SandboxStudio-$version-win-x64.exe.sha256" -Raw) -split '\s+')[0]
          echo "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Preview Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SandboxStudio-${{ env.APP_VERSION }}-win-x64
          path: |
            dist/SandboxStudio-${{ env.APP_VERSION }}-win-x64.exe
            dist/SandboxStudio-${{ env.APP_VERSION }}-win-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Generate Release Notes
        if: inputs.create_release
        shell: pwsh
        run: |
          $tag = "v${{ env.APP_VERSION }}"
          $exe = "SandboxStudio-${{ env.APP_VERSION }}-win-x64.exe"
          $exeMB = [math]::Round((Get-Item "dist/$exe").Length / 1MB, 1)
          $prevTag = git tag --sort=-version:refname | Select-Object -First 1
          $range = if ($prevTag) { "$prevTag..HEAD" } else { "HEAD" }
          $commitLines = git log $range --pretty=format:"- %s (%h)" --no-merges
          $commits = if ($commitLines) { $commitLines -join "`n" } else { "- No new commits" }
          @"
          ## SandboxStudio $tag

          Portable Windows x64 app in a single file. Download ``$exe`` and run it — no installer, no .NET or Windows App SDK install needed. The first launch of each version takes a few extra seconds while it unpacks to ``%TEMP%\.net``.

          ### Commits in this release
          $commits

          ### Artifact
          | File | Size | SHA-256 |
          |---|---|---|
          | ``$exe`` | $exeMB MB | ``${{ env.SHA256 }}`` |

          > Built by GitHub Actions ``release.yml``.
          "@ | Out-File -FilePath release-notes.md -Encoding utf8

      - name: Create GitHub Release
        if: inputs.create_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ env.APP_VERSION }}"
          git tag -a $tag -m "SandboxStudio ${{ env.APP_VERSION }}"
          git push origin $tag
          $exe = "dist/SandboxStudio-${{ env.APP_VERSION }}-win-x64.exe"
          gh release create $tag $exe "$exe.sha256" `
            --title "SandboxStudio $tag" `
            --notes-file release-notes.md `
            --repo ${{ github.repository }}
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed." }
