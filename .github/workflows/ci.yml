name: CI Build & Test

on:
  push:
    branches: [ main ]
  # Every pull request, including ones stacked on another feature branch.
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    name: Build & Test Solution

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore SandboxStudio.sln

      - name: Build Solution
        run: dotnet build SandboxStudio.sln --configuration Release --no-restore

      - name: Execute Unit Tests
        run: dotnet test tests/SandboxStudio.Tests.Unit/SandboxStudio.Tests.Unit.csproj --configuration Release --no-build --logger "trx;LogFileName=unit-tests.trx" --collect:"XPlat Code Coverage"

      - name: Execute Integration Tests
        run: dotnet test tests/SandboxStudio.Tests.Integration/SandboxStudio.Tests.Integration.csproj --configuration Release --no-build --logger "trx;LogFileName=integration-tests.trx"

      - name: Execute Smoke Tests
        run: dotnet test tests/SandboxStudio.Tests.Smoke/SandboxStudio.Tests.Smoke.csproj --configuration Release --no-build --logger "trx;LogFileName=smoke-tests.trx"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 7

  package:
    runs-on: windows-latest
    name: Package (single exe + MSIX)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Packaging regressions (a loose file next to the exe, a broken manifest)
      # otherwise surface only on release day.
      - name: Publish Single-File Executable
        shell: pwsh
        run: ./scripts/publish.ps1 -OutputRoot dist

      - name: Package MSIX (x64)
        shell: pwsh
        run: ./scripts/package-msix.ps1 -Platforms x64 -OutputRoot dist
